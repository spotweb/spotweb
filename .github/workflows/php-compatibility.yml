name: PHP Compatibility

on:
  push:
  pull_request:

jobs:
  compatibility:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
          coverage: none

      - name: Show PHP version
        run: php -v

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --ignore-platform-reqs

      - name: Check PHP syntax
        run: |
          find . -path './vendor' -prune -o -path './.git' -prune -o -type f -name '*.php' -print0 |
          xargs -0 -n1 php -l

      - name: Configure PHPCompatibility
        run: vendor/bin/phpcs --config-set installed_paths vendor/phpcompatibility/php-compatibility

      - name: Check PHP compatibility
        run: vendor/bin/phpcs --extensions=php --ignore='*/vendor/*,*/js/*,*\.inc*,*/tests/*' --standard=PHPCompatibility --runtime-set testVersion "${{ matrix.php-version }}-" .
